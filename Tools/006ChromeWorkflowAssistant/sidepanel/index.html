<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页工作流助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>网页工作流助手</h1>
        <p>当前标签页内的人机协作工具</p>
      </div>
      <button id="refresh-context" class="secondary">重新检测</button>
    </header>

    <section class="status-card">
      <div><span class="label">当前站点</span><strong id="site-name">检测中</strong></div>
      <div><span class="label">页面状态</span><span id="page-status">—</span></div>
      <p id="permission-hint" class="hint"></p>
    </section>

    <main>
      <section id="unsupported-section" class="workflow-card hidden">
        <h2>当前页面未适配</h2>
        <p>请打开快手创作者页面、BOSS 直聘或 X，然后再次点击扩展图标。</p>
      </section>

      <section id="kuaishou-section" class="workflow-card hidden">
        <h2>快手发布辅助</h2>
        <p class="notice">视频文件必须在网页中人工选择；扩展只填字段，不点击最终发布。</p>
        <button id="kuaishou-highlight" class="secondary full">定位上传区域</button>
        <label>作品描述<textarea id="kuaishou-caption" rows="5" placeholder="输入作品描述"></textarea></label>
        <label>合集名称<input id="kuaishou-collection" type="text" placeholder="仅填入文本，候选需人工确认" /></label>
        <label>同城页展示
          <select id="kuaishou-nearby-mode">
            <option value="">不修改</option>
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
        </label>
        <label>定时发布时间<input id="kuaishou-time" type="datetime-local" /></label>
        <button id="kuaishou-apply" class="primary full">填入当前编辑页</button>
      </section>

      <section id="boss-section" class="workflow-card hidden">
        <h2>BOSS 职位辅助</h2>
        <p class="notice">只扫描当前已加载职位、生成草稿并填入聊天框；不会点击发送。</p>
        <label>筛选关键词<input id="boss-keywords" type="text" placeholder="C++，Python，客户端，图形" /></label>
        <button id="boss-scan" class="primary full">扫描当前页面职位</button>
        <div id="boss-summary" class="summary"></div>
        <div id="boss-jobs" class="result-list"></div>
        <label>沟通模板<textarea id="boss-template" rows="5"></textarea></label>
        <div class="button-row">
          <button id="boss-copy" class="secondary">复制草稿</button>
          <button id="boss-fill" class="primary">填入聊天框</button>
        </div>
      </section>

      <section id="x-section" class="workflow-card hidden">
        <h2>X 时间线提示词</h2>
        <p class="notice">只读取当前已经加载并可见的推文，不自动滚动。</p>
        <label class="check-row"><input id="x-include-all" type="checkbox" /> 收集全部可见推文，不只筛选提示词</label>
        <button id="x-scan" class="primary full">扫描当前可见时间线</button>
        <div id="x-summary" class="summary"></div>
        <div class="button-row">
          <button id="x-export-json" class="secondary">导出 JSON</button>
          <button id="x-export-md" class="secondary">导出 Markdown</button>
          <button id="x-clear" class="danger">清空</button>
        </div>
        <div id="x-items" class="result-list"></div>
      </section>
    </main>

    <section class="log-card">
      <h2>运行记录</h2>
      <pre id="log-output">等待操作。</pre>
    </section>

    <script src="app.js"></script>
  </body>
</html>
